<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthèse des Budgets 2026 — Salad &amp; Co</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
#frame{border:0;width:100vw;height:100vh;display:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:radial-gradient(1200px 700px at 15% -10%,#1e4a2c 0,transparent 55%),linear-gradient(160deg,#0f2417,#16351f)}
.card{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:34px 30px;text-align:center;width:370px;max-width:92vw}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(135deg,#3aa85e,#1f6b39);display:flex;align-items:center;justify-content:center}
h1{font-size:20px;font-weight:700;color:#14281c}p{font-size:13px;color:#5c7263;margin:6px 0 20px}
label{display:block;text-align:left;font-size:12px;font-weight:600;color:#5c7263;margin-bottom:6px}
input{width:100%;font-size:15px;font-family:inherit;border:1px solid #e4ebe6;border-radius:11px;padding:12px 13px;margin-bottom:13px}
input:focus{outline:none;border-color:#2f8f4e}
button{width:100%;border:none;cursor:pointer;font-size:14px;font-weight:600;border-radius:11px;padding:13px;color:#fff;background:linear-gradient(135deg,#3aa85e,#1f6b39)}
.m{font-size:13px;margin-top:12px;min-height:16px;color:#c0392b}</style>
<!-- SALADCO — chrome commun (début) -->
<link rel="stylesheet" href="assets/css/saladco.css">
<link rel="manifest" href="assets/manifests/budget.webmanifest">
<meta name="theme-color" content="#6d4aa7">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<script defer src="assets/js/saladco-nav.js" data-app="budget"></script>
<!-- SALADCO — chrome commun (fin) -->
</head>
<body>
<iframe id="frame" title="Synthèse des Budgets 2026"></iframe>
<div id="ov"><div class="card">
<div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>
<h1>Synthèse des Budgets 2026</h1><p>Salad &amp; Co — connexion requise</p>
<form id="f"><label>Adresse mail</label><input type="email" id="em" autocomplete="username" placeholder="prenom.nom@saladandco.fr" required>
<label>Mot de passe</label><input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" required>
<button type="submit" id="bt">Se connecter</button></form>
<div class="m" id="msg"></div></div></div>
<script>
var SB_URL='https://wplolvjziqqvvcydvfxs.supabase.co', SB_KEY='sb_publishable__ETgYHnd7kBRJ-4QIkrxPw_UzPxo0dp', NAME='budget';
var sb=supabase.createClient(SB_URL,SB_KEY);
var ov=document.getElementById('ov'), frame=document.getElementById('frame'), msg=document.getElementById('msg');
async function load(session){
  if(!session) return;
  var r=await sb.from('tools').select('html').eq('name',NAME).maybeSingle();
  if(r.error){ msg.textContent='Erreur : '+r.error.message; return; }
  if(!r.data){ msg.textContent='Contenu indisponible (accès refusé).'; await sb.auth.signOut(); return; }
  frame.srcdoc=r.data.html; frame.style.display='block'; ov.style.display='none';
}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault(); var b=document.getElementById('bt'); b.disabled=true; msg.style.color='#5c7263'; msg.textContent='Connexion…';
  var r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  b.disabled=false;
  if(r.error){ msg.style.color='#c0392b'; msg.textContent='Échec : '+r.error.message; } else { msg.style.color='#1f6b39'; msg.textContent='Connecté ✓'; }
});
sb.auth.onAuthStateChange(function(_e,s){ load(s); });
sb.auth.getSession().then(function(x){ load(x.data.session); });
</script></body></html>
