<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Passeport Collaborateur · Salad&Co</title>
<meta name="theme-color" content="#1b1d1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Passeport">
<style>
  :root{
    --green:#6cbe2e;--green-d:#4f9a1c;--green-l:#eaf7dd;--ink:#1b1d1a;--ink-soft:#4a4f47;
    --muted:#8a9184;--paper:#fff;--bg:#f4f6f0;--kraft:#c9a878;--line:#e5e9de;--gold:#f2b21e;
    --shadow:0 6px 24px rgba(30,50,15,.08);--shadow-lg:0 18px 50px rgba(30,50,15,.16);--r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}
  header.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer}
  .brand .amp{font-weight:900;font-size:30px;color:var(--green);line-height:1;transform:skewX(-6deg)}
  .brand .btxt{display:flex;flex-direction:column;line-height:1.05}
  .brand .btxt b{font-size:16px;letter-spacing:.3px}
  .brand .btxt span{font-size:10px;color:var(--green);letter-spacing:2px;text-transform:uppercase}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:#cfd6c8;flex-wrap:wrap}
  .crumbs a{color:#cfd6c8;cursor:pointer;text-decoration:none}
  .crumbs a:hover{color:#fff}
  .crumbs .sep{opacity:.5}
  .crumbs .cur{color:#fff;font-weight:600}
  .topbar .spacer{flex:1}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{color:#cfd6c8;background:rgba(255,255,255,.08);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .icon-btn:hover{background:rgba(255,255,255,.18);color:#fff}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:5px 6px 5px 12px;border-radius:30px}
  .user-chip .un{font-size:13px;color:#fff;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role-pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .role-pill.admin{background:var(--green);color:#fff}
  .role-pill.invite{background:var(--gold);color:#3a2c05}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 22px 80px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head h1{font-size:26px;margin:0 0 4px}
  .page-head p{margin:0;color:var(--muted);font-size:14px}
  .btn{background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(108,190,46,.35);transition:.15s}
  .btn:hover{background:var(--green-d);transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .btn.ghost:hover{background:#f6f8f2}
  .btn.small{padding:8px 13px;font-size:13px}
  .btn.danger{background:#e5533c;box-shadow:0 4px 14px rgba(229,83,60,.3)}
  .btn.danger:hover{background:#c9401f}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;transition:.18s;border:1px solid var(--line);position:relative;overflow:hidden}
  .card.click{cursor:pointer}
  .card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card .card-top-strip{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--green),#a5db63)}
  .resto-icon{width:46px;height:46px;border-radius:12px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:18px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .stat-row{display:flex;gap:16px;margin-top:12px}
  .stat{flex:1}
  .stat b{font-size:20px;display:block}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .add-card{border:2px dashed #cdd7c0;background:transparent;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;color:var(--green-d);font-weight:700;transition:.15s;cursor:pointer}
  .add-card:hover{border-color:var(--green);background:var(--green-l)}
  .add-card .plus{font-size:34px;line-height:1}
  .collab-card{display:flex;flex-direction:column;gap:0}
  .collab-head{display:flex;gap:13px;align-items:center;margin-bottom:14px}
  .avatar{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;background:linear-gradient(135deg,var(--green),var(--green-d))}
  .collab-head .who{min-width:0}
  .collab-head .who b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collab-head .who span{font-size:12px;color:var(--muted)}
  .lvl-pill{background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-top:3px}
  .progress-wrap{margin:6px 0 4px}
  .progress-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--ink-soft)}
  .progress-line b{color:var(--green-d)}
  .bar{height:9px;background:#eef1e9;border-radius:20px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9ad358);border-radius:20px;transition:width .5s ease}
  .mini-badges{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
  .mini-badge{width:26px;height:26px;border-radius:8px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:14px}
  .mini-badge.locked{background:#f0f1ee;filter:grayscale(1);opacity:.5}
  .collab-actions{display:flex;gap:7px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .collab-actions .btn{flex:1;justify-content:center}
  .tiny-btn{background:#f2f4ef;color:var(--ink-soft);border-radius:9px;padding:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
  .tiny-btn:hover{background:#e7ebe0}
  .tiny-btn.danger:hover{background:#fbe4de;color:#c9401f}
  .archived-tag{position:absolute;top:14px;right:14px;background:#ececea;color:#8a8a86;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
  .subtabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:22px;overflow-x:auto}
  .subtab{padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;transition:.15s}
  .subtab:hover{background:#f2f4ef}
  .subtab.active{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(108,190,46,.35)}
  .subtab .cnt{font-size:11px;opacity:.85;margin-left:3px}
  .pp-hero{background:linear-gradient(135deg,#232622,#161814);color:#fff;border-radius:22px;padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .pp-hero::after{content:"&";position:absolute;right:-10px;bottom:-40px;font-size:210px;font-weight:900;color:rgba(108,190,46,.14);transform:skewX(-6deg);line-height:1}
  .pp-hero-top{display:flex;gap:18px;align-items:center;position:relative;z-index:2;flex-wrap:wrap}
  .pp-avatar{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green-d));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex-shrink:0}
  .pp-id h2{margin:0;font-size:24px}
  .pp-id .meta{color:#b9c1b0;font-size:13px;margin-top:3px}
  .pp-id .meta b{color:#fff}
  .pp-hero .lvlbox{margin-left:auto;text-align:right;position:relative;z-index:2}
  .pp-hero .lvlbox .lvl-name{font-size:13px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .pp-hero .lvlbox .lvl-num{font-size:34px;font-weight:900;line-height:1}
  .pp-hero .lvlbox .xp{font-size:12px;color:#b9c1b0}
  .pp-xpbar{margin-top:20px;position:relative;z-index:2}
  .pp-xpbar .lab{display:flex;justify-content:space-between;font-size:12px;color:#cdd4c6;margin-bottom:6px}
  .pp-xpbar .bar{height:12px;background:rgba(255,255,255,.12)}
  .pp-xpbar .bar>i{background:linear-gradient(90deg,var(--green),var(--gold))}
  .dash{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.dash{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
  .panel h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
  .panel .phint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .module-prog{display:flex;flex-direction:column;gap:13px}
  .mp-row .mp-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .mp-row .mp-top .nm{font-weight:600}
  .mp-row .mp-top .vl{color:var(--muted);font-size:12px}
  .mp-row.done .mp-top .vl{color:var(--green-d);font-weight:700}
  .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
  .badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--green-l);transition:.15s;position:relative}
  .badge.locked{background:#f2f3f0;filter:grayscale(1);opacity:.55}
  .badge .emo{font-size:30px;line-height:1}
  .badge .bn{font-size:10.5px;font-weight:700;margin-top:6px;color:var(--ink-soft);line-height:1.2}
  .challenges{display:flex;flex-direction:column;gap:10px}
  .chal{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:12px;background:#f7f9f4;border:1px solid var(--line)}
  .chal.done{background:var(--green-l);border-color:#cfe9b4}
  .chal .ck{width:24px;height:24px;border-radius:50%;border:2px solid #cdd7c0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .chal.done .ck{background:var(--green);border-color:var(--green)}
  .chal .ctxt{font-size:13px}
  .chal .ctxt b{display:block}
  .chal .ctxt span{color:var(--muted);font-size:12px}
  .chal .reward{margin-left:auto;font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap}
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-26px;top:1px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:9px}
  .tl-item.milestone .tl-dot{border-color:var(--gold);background:var(--gold);color:#fff}
  .tl-item .tl-date{font-size:11px;color:var(--muted);font-weight:600}
  .tl-item .tl-txt{font-size:13.5px;margin-top:1px}
  .module-block{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
  .mb-head{display:flex;align-items:center;gap:13px;padding:16px 20px;cursor:pointer;transition:.15s}
  .mb-head:hover{background:#f8faf5}
  .mb-emo{width:42px;height:42px;border-radius:12px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .mb-head .mb-title{flex:1;min-width:0}
  .mb-head .mb-title b{font-size:15.5px}
  .mb-head .mb-title .mb-sub{font-size:12px;color:var(--muted)}
  .mb-prog{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .mb-prog .ring{font-size:12px;font-weight:800;color:var(--green-d);min-width:38px;text-align:right}
  .mb-chevron{color:var(--muted);transition:.2s;font-size:13px}
  .module-block.open .mb-chevron{transform:rotate(180deg)}
  .mb-badge-done{background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
  .mb-body{display:none;padding:4px 20px 16px;border-top:1px solid var(--line)}
  .module-block.open .mb-body{display:block}
  .comp{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
  .comp:last-child{border-bottom:none}
  .comp .cbox{width:24px;height:24px;border-radius:7px;border:2px solid #cdd7c0;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.15s;cursor:pointer;background:#fff}
  .comp.on .cbox{background:var(--green);border-color:var(--green)}
  .comp .clabel{flex:1;font-size:13.5px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
  .comp.on .clabel{color:var(--muted);text-decoration:line-through;text-decoration-color:#cdd7c0}
  .comp .chelp{color:var(--muted);font-style:italic;font-size:12px}
  .comp .cdate{font-size:11px;color:var(--green-d);white-space:nowrap;margin-top:3px;flex-basis:100%}
  .cbox.ro{cursor:not-allowed;opacity:.85;border-style:dashed}
  .comp.on .cbox.ro{opacity:1}
  .eval-note{background:#f7f9f4;border-radius:12px;padding:13px 15px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:10px;align-items:flex-start}
  .eval-note textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:13px;resize:vertical;min-height:52px;margin-top:6px}
  .cattag{display:inline-block;color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;margin-right:6px;vertical-align:middle}
  .stage-cur{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
  .ead-block.acq .mb-emo{box-shadow:0 0 0 2px var(--green) inset}
  .ead-lock{display:flex;align-items:center;gap:13px;background:#fbf6e8;border:1px solid #f0e2b8;border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:13.5px;color:var(--ink-soft)}
  .ead-lock .lk{font-size:22px}
  .ead-lock b{color:var(--ink)}
  .ead-lock .btn{margin-left:auto;flex-shrink:0}
  .ead-lock.openw{background:var(--green-l);border-color:#cfe9b4}
  .sess-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .sess-row:last-child{border-bottom:none}
  .sess-main{flex:1;min-width:0}
  .sess-top{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sess-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .sess-note{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px}
  .sess-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .sess-chip.open{background:var(--green);color:#fff}
  .sess-chip.closed{background:#e7ebe0;color:var(--ink-soft)}
  .sess-chip.planned{background:#fbeecb;color:#a97b12}
  .sess-acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
  .signrow{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
  .signbox{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafcf7}
  .signbox .sl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .signbox .simg{width:100%;height:90px;border-radius:8px;background:#fff;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .signbox .simg img{max-width:100%;max-height:100%}
  .signbox .smeta{font-size:11.5px;color:var(--ink-soft);margin-top:7px}
  .signbox .smeta b{color:var(--ink)}
  .signpad-wrap{border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none}
  .signpad-wrap canvas{display:block;width:100%;height:180px;border-radius:12px;cursor:crosshair}
  .dash-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .tile{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;border:1px solid var(--line);position:relative;overflow:hidden}
  .tile .tv{font-size:32px;font-weight:900;line-height:1;color:var(--ink)}
  .tile .tl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .tile .te{position:absolute;right:12px;top:12px;font-size:22px;opacity:.5}
  .sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#eef1e9}
  .sbar span{display:block;height:100%}
  .sbar.empty{align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:#f4f6f0;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .legend .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
  .rank-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .rank-row .rn{width:170px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .rank-row .rn:hover{color:var(--green-d)}
  .rank-row .rbar{flex:1;height:24px;background:#eef1e9;border-radius:8px;overflow:hidden;position:relative;min-width:80px}
  .rank-row .rbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9ad358);border-radius:8px;transition:width .5s}
  .rank-row .rbar>.rv{position:absolute;right:9px;top:0;line-height:24px;font-size:12px;font-weight:800;color:var(--ink)}
  .rank-row .rc{width:74px;text-align:right;font-size:12px;color:var(--muted)}
  .dtable{width:100%;border-collapse:collapse;font-size:13px}
  .dtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
  .dtable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .dtable tr:last-child td{border-bottom:none}
  .dtable tbody tr:hover td{background:#f8faf5}
  .dtable .rname{font-weight:700;cursor:pointer;color:var(--ink)}
  .dtable .rname:hover{color:var(--green-d)}
  .dt-empty{color:var(--muted);font-style:italic;font-size:12px}
  .journal{display:flex;flex-direction:column;gap:0}
  .jrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .jrow:last-child{border-bottom:none}
  .jrow .jt{color:var(--muted);white-space:nowrap;font-size:11.5px;min-width:112px}
  .jrow .jd b{color:var(--ink)}
  .jrow .ja{color:var(--green-d);font-weight:600}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .emo{font-size:52px;margin-bottom:12px}
  .empty h3{color:var(--ink);margin:0 0 6px}
  .overlay{position:fixed;inset:0;background:rgba(20,25,15,.55);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}

function normalizeRef(r){ const d=buildDefaultRef(); if(!r||typeof r!=='object') return d; ['postes','materiel','elearning','reglementaire','eadStages','eadComps','suiviEssai','suiviEmp'].forEach(k=>{ if(!Array.isArray(r[k])||!r[k].length) r[k]=d[k]; }); return r; }

/* ===================== HELPERS ===================== */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function frDate(iso){ if(!iso) return ''; const d=String(iso).slice(0,10).split('-'); return d[2]+'/'+d[1]+'/'+d[0]; }
function frDateTime(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function initials(c){ return ((c.firstName||'?')[0]+((c.lastName||'')[0]||'')||'?').toUpperCase(); }
function monthsSince(iso){ if(!iso) return 0; const s=new Date(iso),n=new Date(); return Math.max(0,(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth())); }
function fmtSeniority(m){ if(m<1) return '< 1 mois'; const y=Math.floor(m/12),mm=m%12; if(y===0) return mm+' mois'; return y+' an'+(y>1?'s':'')+(mm?(' '+mm+' m'):''); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function eadColor(i){ if(i<=0) return '#d8dcd0'; const total=REF.eadStages.length; const t=total<=1?0:(i-1)/(total-1); const a=[0xa5,0xd7,0x6b],b=[0x1f,0x4d,0x1c]; const c=a.map((v,k)=>Math.round(v+(b[k]-v)*t)); return 'rgb('+c.join(',')+')'; }

/* progression par ID */
function posteProg(p,pid){ return (p.postes[pid]&&p.postes[pid].comps)||{}; }
function posteDone(p,pid){ const po=REF.postes.find(x=>x.id===pid); if(!po||!po.comps.length) return false; const pr=posteProg(p,pid); return po.comps.every(c=>pr[c.id]&&pr[c.id].done); }
function matDone(p,mid){ const m=REF.materiel.find(x=>x.id===mid); if(!m||!m.comps.length) return false; const pr=(p.materiel[mid]&&p.materiel[mid].comps)||{}; return m.comps.every(c=>pr[c.id]&&pr[c.id].done); }
function moduleStats(p){
  const rows=[]; let dP=0,tP=0;
  REF.postes.forEach(po=>{const pr=posteProg(p,po.id);dP+=po.comps.filter(c=>pr[c.id]&&pr[c.id].done).length;tP+=po.comps.length;});
  rows.push({key:'postes',label:'Formation par poste',emo:'👨‍🍳',done:dP,total:tP});
  let dM=0,tM=0; REF.materiel.forEach(m=>{const pr=(p.materiel[m.id]&&p.materiel[m.id].comps)||{};dM+=m.comps.filter(c=>pr[c.id]&&pr[c.id].done).length;tM+=m.comps.length;});
  rows.push({key:'materiel',label:'Matériel',emo:'⚙️',done:dM,total:tM});
  rows.push({key:'elearning',label:'E-Learning',emo:'💻',done:REF.elearning.filter(e=>p.elearning[e.id]).length,total:REF.elearning.length});
  rows.push({key:'reglementaire',label:'Réglementaire',emo:'📋',done:REF.reglementaire.filter(r=>p.reglementaire[r.id]&&p.reglementaire[r.id].done).length,total:REF.reglementaire.length});
  return rows;
}
function totalDone(p){ return moduleStats(p).reduce((s,r)=>s+r.done,0); }
function totalAll(p){ return moduleStats(p).reduce((s,r)=>s+r.total,0); }
function globalPct(p){ const t=totalAll(p); return t?Math.round(totalDone(p)/t*100):0; }
function eadDone(p,cid){ return p.ead&&p.ead[cid]&&p.ead[cid].done; }
function eadStageOf(p){ let cur=0; const N=REF.eadStages.length; for(let s=1;s<=N;s++){ const ok=REF.eadComps.every(c=>c.stage>s||eadDone(p,c.id)); if(ok)cur=s; else break; } return cur; }
function eadStageInfo(p){ const cur=eadStageOf(p),next=Math.min(cur+1,REF.eadStages.length); let done=0,total=0; REF.eadComps.forEach(c=>{ if(c.stage<=next){total++; if(eadDone(p,c.id))done++;} }); return {cur,next,done,total,pct:total?Math.round(done/total*100):0,atMax:cur>=REF.eadStages.length}; }
function eadOpenSession(p){ const t=todayISO(); return (p.eadSessions||[]).find(s=>s.status==='ouverte'||(s.status==='planifiee'&&s.openDate&&s.openDate<=t&&(!s.closeDate||s.closeDate>=t)))||null; }
function eadLocked(p){ return !eadOpenSession(p); }

/* ===================== FABRIQUE PASSEPORT ===================== */
function operationalTemplate(){ return {postes:{},materiel:{},elearning:{},reglementaire:{},events:[]}; }
function operationalOnly(p){ return {postes:p.postes,materiel:p.materiel,elearning:p.elearning,reglementaire:p.reglementaire,events:p.events||[]}; }
function ensureOperational(pp){ pp.postes=pp.postes||{}; pp.materiel=pp.materiel||{}; pp.elearning=pp.elearning||{}; pp.reglementaire=pp.reglementaire||{}; pp.events=pp.events||[]; return pp; }

/* ===================== CHARGEMENT ===================== */
function mapSession(s){ return {id:s.id,label:s.label,openDate:s.open_date,closeDate:s.close_date,status:s.status,evaluator:s.evaluator,notes:s.notes,startStage:s.start_stage,endStage:s.end_stage,closedAt:s.closed_at,managerSign:s.manager_sign,managerSignName:s.manager_sign_name,managerSignedAt:s.manager_signed_at,collabSign:s.collab_sign,collabSignName:s.collab_sign_name,collabSignedAt:s.collab_signed_at}; }
function mapEntretien(e){ return {id:e.id,type:e.type,date:e.date,by:e.by,answers:e.answers||{},managerSign:e.manager_sign,managerSignName:e.manager_sign_name,managerSignedAt:e.manager_signed_at,collabSign:e.collab_sign,collabSignName:e.collab_sign_name,collabSignedAt:e.collab_signed_at}; }

async function loadRef(){
  const {data}=await sb.from('pp_config').select('data').eq('id','main').maybeSingle();
  if(data&&data.data&&Array.isArray(data.data.postes)){ REF=normalizeRef(data.data); }
  else { REF=buildDefaultRef(); if(isAdmin()){ try{ await sb.from('pp_config').upsert({id:'main',data:REF,updated_by:ME.id}); }catch(e){} } }
}
async function loadAll(){
  const [rr,cc,pr,se,en,au]=await Promise.all([
    sb.from('pp_restaurants').select('*').order('created_at'),
    sb.from('pp_collaborators').select('*').order('created_at'),
    sb.from('pp_ead_progress').select('*'),
    sb.from('pp_ead_sessions').select('*').order('open_date'),
    sb.from('pp_entretiens').select('*').order('created_at'),
    sb.from('pp_audit_log').select('*').order('created_at',{ascending:false}).limit(600)
  ]);
  const rests=rr.data||[],collabs=cc.data||[],prog=pr.data||[],sess=se.data||[],entr=en.data||[];
  STORE.audit=au.data||[];
  const byId={};
  collabs.forEach(c=>{ const pp=ensureOperational(c.passport||{}); pp.ead={}; pp.eadSessions=[]; pp.suiviEssai=[]; pp.suiviEmp=[]; c._pp=pp; byId[c.id]=c; });
  prog.forEach(r=>{ const c=byId[r.collaborator_id]; if(c)c._pp.ead[r.comp_id]={done:r.done,date:r.done_at}; });
  sess.forEach(s=>{ const c=byId[s.collaborator_id]; if(c)c._pp.eadSessions.push(mapSession(s)); });
  entr.forEach(e=>{ const c=byId[e.collaborator_id]; if(c)(e.type==='essai'?c._pp.suiviEssai:c._pp.suiviEmp).push(mapEntretien(e)); });
  STORE.restaurants=rests.map(r=>({id:r.id,name:r.name,city:r.city,collaborators:collabs.filter(c=>c.restaurant_id===r.id).map(c=>({id:c.id,firstName:c.first_name,lastName:c.last_name,role:c.role,entryDate:c.entry_date,archived:c.archived,passport:c._pp}))}));
}

function renderHome(){
  const rs=STORE.restaurants;
  let cards=rs.map(r=>{ const act=r.collaborators.filter(c=>!c.archived); const avg=act.length?Math.round(act.reduce((s,c)=>s+globalPct(c.passport),0)/act.length):0;
    return `<div class="card click" onclick="go('resto',{rid:'${r.id}'})"><div class="card-top-strip"></div><div class="resto-icon">🏠</div><h3>${esc(r.name)}</h3><div class="sub">${esc(r.city||'Restaurant Salad&Co')}</div><div class="stat-row"><div class="stat"><b>${act.length}</b><span>Collaborateurs</span></div><div class="stat"><b>${avg}%</b><span>Progression moy.</span></div></div></div>`;
  }).join('');

  app.innerHTML=`<div class="page-head"><div><h1>Vos restaurants</h1><p>Chaque restaurant gère sa propre équipe et ses passeports collaborateurs.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap">${installBtnHtml()}<button class="btn ghost" onclick="go('dashboard')">📊 Comparer les restaurants</button>${isAdmin()?`<button class="btn ghost" onclick="startL29Import()" title="Mettre à jour les effectifs depuis un PDF L29">📥 L29 - SUIVI DES EFFECTIFS</button><button class="btn" onclick="modalResto()">＋ Nouveau restaurant</button>`:''}</div></div>${rs.length===0?`<div class="empty"><div class="emo">🏝️</div><h3>Aucun restaurant</h3><p>${isAdmin()?'Créez votre premier restaurant.':'Aucune donnée pour l’instant.'}</p></div>`:`<div class="grid">${cards}</div>`}`;
}
function renderResto(){
  const r=getResto(VIEW.rid); if(!r){go('home');return;}
  const showArch=VIEW.arch===true;
  const act=r.collaborators.filter(c=>!c.archived),arch=r.collaborators.filter(c=>c.archived);
  const list=showArch?arch:act;
  let cards=list.map(c=>collabCard(r,c)).join('');
  if(!showArch&&isAdmin()) cards+=`<div class="add-card" onclick="modalCollab('${r.id}')"><div class="plus">+</div>Nouveau collaborateur</div>`;
  app.innerHTML=`<div class="page-head"><div><h1>${esc(r.name)}</h1><p>${act.length} actif(s) · ${arch.length} archivé(s)</p></div>${!showArch&&isAdmin()?`<button class="btn" onclick="modalCollab('${r.id}')">＋ Nouveau collaborateur</button>`:''}</div>
    <div class="subtabs" style="max-width:360px"><div class="subtab ${!showArch?'active':''}" onclick="go('resto',{rid:'${r.id}',arch:false})">Actifs <span class="cnt">${act.length}</span></div><div class="subtab ${showArch?'active':''}" onclick="go('resto',{rid:'${r.id}',arch:true})">Archivés <span class="cnt">${arch.length}</span></div></div>
    ${list.length===0?`<div class="empty"><div class="emo">${showArch?'📁':'👥'}</div><h3>${showArch?'Aucun passeport archivé':'Aucun collaborateur'}</h3><p>${showArch?'Les passeports archivés apparaîtront ici.':(isAdmin()?'Ajoutez un collaborateur pour créer son passeport.':'')}</p></div>`:''}
    <div class="grid">${cards}</div>`;

function buildTimeline(p,c){
  const items=[]; items.push({iso:c.entryDate,date:frDate(c.entryDate),txt:'🎉 <b>Arrivée dans l’équipe</b> — bienvenue dans la tribu !',milestone:true});
  const start=new Date(c.entryDate||todayISO()),now=new Date();
  [[1,'1 mois'],[3,'3 mois'],[6,'6 mois'],[12,'1 an'],[24,'2 ans'],[36,'3 ans'],[60,'5 ans']].forEach(([m,lab])=>{ const d=new Date(start); d.setMonth(d.getMonth()+m); if(d<=now)items.push({iso:d.toISOString().slice(0,10),date:frDate(d.toISOString().slice(0,10)),txt:`🕒 <b>${lab} d’ancienneté</b>`,milestone:false}); });
  (p.events||[]).forEach(ev=>items.push({iso:ev.iso,date:frDate(ev.iso),txt:ev.txt,milestone:ev.milestone}));
  (p.eadSessions||[]).forEach(s=>{ if(s.status==='cloturee'&&s.closedAt){ const st=s.endStage>0&&REF.eadStages[s.endStage-1]?(REF.eadStages[s.endStage-1].emo+' '+REF.eadStages[s.endStage-1].name):'🌰'; items.push({iso:s.closedAt,date:frDate(s.closedAt),txt:`📋 <b>${esc(s.label)} clôturée</b> — ${st}`,milestone:true}); } });
  (p.suiviEssai||[]).forEach(e=>{ if(e.date)items.push({iso:e.date,date:frDate(e.date),txt:'💬 <b>Entretien période d’essai</b>',milestone:false}); });
  (p.suiviEmp||[]).forEach(e=>{ if(e.date)items.push({iso:e.date,date:frDate(e.date),txt:'💬 <b>Entretien de suivi</b>',milestone:false}); });
  items.sort((a,b)=>(a.iso||'').localeCompare(b.iso||'')); return items;
}

let signCtx=null;
function openSign(kind,id,role){
  const c=curCollab();
  const who=role==='manager'?(ME.full_name||''):(c.firstName+' '+c.lastName);
  const roleLabel=role==='manager'?'Évaluateur (manager)':'Collaborateur';
  modal.innerHTML=`<h3>Signature — ${roleLabel}</h3><p class="mhint">Signez dans le cadre ci-dessous. La date et l’heure sont enregistrées automatiquement.</p>
    <div class="field"><label>Nom du signataire</label><input id="signName" value="${esc(who)}"></div>
    <div class="signpad-wrap"><canvas id="signPad"></canvas></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><button class="tiny-btn" onclick="clearSign()">↺ Effacer</button><span style="font-size:11.5px;color:var(--muted)">🕓 ${frDateTime(nowISO())}</span></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveSign('${kind}','${id}','${role}')">Valider la signature</button></div>`;
  overlay.classList.add('show'); setTimeout(()=>initSignPad(),60);
}
function initSignPad(){
  const cv=document.getElementById('signPad'); if(!cv)return;
  const rect=cv.getBoundingClientRect(); cv.width=rect.width*2; cv.height=(rect.height||180)*2; const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1b1d1a';
  let drawing=false,last=null,dirty=false;
  function pos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing)return; const q=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(q.x,q.y); ctx.stroke(); last=q; dirty=true; e.preventDefault(); }
  function end(){ drawing=false; }
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  signCtx={cv,ctx,isDirty:()=>dirty,reset:()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;}};
}
function clearSign(){ if(signCtx)signCtx.reset(); }
async function saveSign(kind,id,role){
  if(!signCtx||!signCtx.isDirty()){ toast('✍️ Merci de signer dans le cadre','err'); return; }
  const name=document.getElementById('signName').value.trim();
  const png=signCtx.cv.toDataURL('image/png');
  const c=curCollab(),ts=nowISO();
  const table=kind==='session'?'pp_ead_sessions':'pp_entretiens';
  const upd=role==='manager'?{manager_sign:png,manager_sign_name:name,manager_signed_at:ts}:{collab_sign:png,collab_sign_name:name,collab_signed_at:ts};
  const {error}=await sb.from(table).update(upd).eq('id',id); if(error)return toast('⚠ '+error.message,'err');
  await audit(kind==='session'?'ead_session':'entretien',c.id,'Signature '+(role==='manager'?'manager':'collaborateur'),name);
  closeModal(); toast('✍️ Signature enregistrée'); reloadAndRender();
}

function exportRef(){
  try{
    const wb=XLSX.utils.book_new();
    const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);
    add('EAD Stades',[['ID','Ordre','Emoji','Nom du stade','Objectif','Ancienneté requise'],...REF.eadStages.map((s,i)=>[s.id,i+1,s.emo,s.name,s.obj,s.sen])]);
    add('EAD Compétences',[['ID','Stade','Catégorie','Question'],...REF.eadComps.map(c=>[c.id,c.stage,(EAD_CATS[c.cat]||EAD_CATS.AUTRE).n,c.label])]);
    const pr=[['ID','Poste','Emoji','Sous-titre','Question','Aide']]; REF.postes.forEach(po=>po.comps.forEach(c=>pr.push([c.id,po.nom,po.emo,po.sub,c.label,c.help]))); add('Postes',pr);
    const mr=[['ID','Machine','Emoji','Point de contrôle']]; REF.materiel.forEach(m=>m.comps.forEach(c=>mr.push([c.id,m.nom,m.emo,c.label]))); add('Matériel',mr);
    add('E-Learning',[['ID','Module','Description','Durée'],...REF.elearning.map(e=>[e.id,e.title,e.desc,e.duree])]);
    add('Réglementaire',[['ID','Formation','Détail','Emoji'],...REF.reglementaire.map(r=>[r.id,r.title,r.detail,r.emo])]);
    add('Entretien essai',[['ID','Question'],...REF.suiviEssai.map(q=>[q.id,q.q])]);
    add('Entretien suivi',[['ID','Question'],...REF.suiviEmp.map(q=>[q.id,q.q])]);
    XLSX.writeFile(wb,'referentiel-passeport-saladco.xlsx');
    toast('⬇ Référentiel exporté');
  }catch(e){ toast('⚠ Export impossible : '+e.message,'err'); }

async function importRef(ev){
  const file=ev.target.files[0]; if(!file){return;} ev.target.value='';
  if(needAdmin())return;
  try{
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'});
    const rows=(name)=>{ const ws=wb.Sheets[name]; if(!ws)return null; return XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(1); };
    const S=(v)=>v==null?'':String(v).trim();
    const nr={version:1};
    // EAD Stades
    let r=rows('EAD Stades');
    nr.eadStages = r? r.filter(x=>S(x[3])).map((x,i)=>({id:S(x[0])||newId('st'),emo:S(x[2])||'🌱',name:S(x[3]),obj:S(x[4]),sen:S(x[5])})) : REF.eadStages;
    if(!nr.eadStages.length) nr.eadStages=REF.eadStages;
    // EAD Compétences
    r=rows('EAD Compétences')||rows('EAD Competences');
    nr.eadComps = r? r.filter(x=>S(x[3])).map(x=>{ const catName=S(x[2]).toLowerCase(); const cat=CAT_BY_NAME[catName]||(EAD_CATS[S(x[2]).toUpperCase()]?S(x[2]).toUpperCase():'AUTRE'); let stg=parseInt(x[1],10); if(!stg||stg<1)stg=1; if(stg>nr.eadStages.length)stg=nr.eadStages.length; return {id:S(x[0])||newId('ec'),label:S(x[3]),cat,stage:stg}; }) : REF.eadComps;
    // Postes (regrouper par nom de poste)
    r=rows('Postes');
    if(r){ const byName={}; const order=[];
      r.filter(x=>S(x[4])).forEach(x=>{ const nom=S(x[1])||'Poste'; if(!byName[nom]){ byName[nom]={nom,emo:S(x[2])||'📋',sub:S(x[3]),comps:[]}; order.push(nom); } byName[nom].comps.push({id:S(x[0])||newId('pc'),label:S(x[4]),help:S(x[5])}); });
      nr.postes = order.map(nom=>{ const ex=REF.postes.find(p=>p.nom===nom); return {id:ex?ex.id:('poste_'+uid()),nom:byName[nom].nom,emo:byName[nom].emo,sub:byName[nom].sub,comps:byName[nom].comps}; });
    } else nr.postes=REF.postes;
    if(!nr.postes.length) nr.postes=REF.postes;
    // Matériel
    r=rows('Matériel')||rows('Materiel');
    if(r){ const byName={}; const order=[];
      r.filter(x=>S(x[3])).forEach(x=>{ const nom=S(x[1])||'Machine'; if(!byName[nom]){ byName[nom]={nom,emo:S(x[2])||'⚙️',comps:[]}; order.push(nom); } byName[nom].comps.push({id:S(x[0])||newId('mc'),label:S(x[3])}); });
      nr.materiel = order.map(nom=>{ const ex=REF.materiel.find(m=>m.nom===nom); return {id:ex?ex.id:('mat_'+uid()),nom:byName[nom].nom,emo:byName[nom].emo,comps:byName[nom].comps}; });
    } else nr.materiel=REF.materiel;
    if(!nr.materiel.length) nr.materiel=REF.materiel;
    // E-Learning
    r=rows('E-Learning');
    nr.elearning = r? r.filter(x=>S(x[1])).map(x=>({id:S(x[0])||newId('el'),title:S(x[1]),desc:S(x[2]),duree:S(x[3])})) : REF.elearning;
    if(!nr.elearning.length) nr.elearning=REF.elearning;
    // Réglementaire
    r=rows('Réglementaire')||rows('Reglementaire');
    nr.reglementaire = r? r.filter(x=>S(x[1])).map(x=>({id:S(x[0])||newId('rg'),title:S(x[1]),detail:S(x[2]),emo:S(x[3])||'📋'})) : REF.reglementaire;
    if(!nr.reglementaire.length) nr.reglementaire=REF.reglementaire;
    // Entretiens
    r=rows('Entretien essai');
    nr.suiviEssai = r? r.filter(x=>S(x[1])).map(x=>({id:S(x[0])||newId('se'),q:S(x[1])})) : REF.suiviEssai;
    if(!nr.suiviEssai.length) nr.suiviEssai=REF.suiviEssai;
    r=rows('Entretien suivi');
    nr.suiviEmp = r? r.filter(x=>S(x[1])).map(x=>({id:S(x[0])||newId('sm'),q:S(x[1])})) : REF.suiviEmp;
    if(!nr.suiviEmp.length) nr.suiviEmp=REF.suiviEmp;

    const {error}=await sb.from('pp_config').upsert({id:'main',data:nr,updated_by:ME.id,updated_at:nowISO()});
    if(error)return toast('⚠ '+error.message,'err');
    await audit('referentiel',null,'Référentiel importé','Mise à jour de la liste des questions');
    REF=normalizeRef(nr);
    closeModal(); toast('✅ Référentiel mis à jour pour tout le monde','gold'); await loadAll(); render();
  }catch(e){ toast('⚠ Import impossible : '+e.message,'err'); }
}

/* ===================== IMPORT L29 (SUIVI DES EFFECTIFS) ===================== */
/* Correspondance nom de site L29 -> nom de restaurant dans l'app.
   Modifiable librement dans l'aperçu via le menu déroulant de chaque site. */
const L29_SITE_MAP={
  'HERON':'Héron','NOYELLES':'Noyelles','LE PONTET':'Le Pontet','MERIGNAC':'Mérignac',
  'VILLENAVE':'Villenave','LILLE':'Salad&Co Lille Centre','KIABI LEZENNES':'Kiabi','KIABI':'Kiabi',
  'ADEO RONCHIN':'Adeo','ADEO':'Adeo','TOULON':'La Valette','CAEN':'Mondeville',
  'BTWIN':'Campus Btwin','CAMPUS':'Campus Btwin','CAMPUS BTWIN':'Campus Btwin'
};
let IMP=null;
function stripAccents(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function normKey(s){ return stripAccents(String(s||'')).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function isTrunc(s){ return /[…]|\.\.\.\s*$/.test(String(s||'')); }
function stripTrunc(s){ return String(s||'').replace(/\s*(?:…|\.\.\.)\s*$/,'').trim(); }
function dmyToIso(s){ const m=String(s||'').match(/(\d{2})-(\d{2})-(\d{4})/); return m?(m[3]+'-'+m[2]+'-'+m[1]):''; }
function splitL29Name(raw){
  const s=stripTrunc(raw).replace(/\s+/g,' ').trim();
  if(!s) return {last:'',first:''};
  const toks=s.split(' ');
  const isUp=t=>{ const l=stripAccents(t).replace(/[^A-Za-z]/g,''); return l.length>0 && l===l.toUpperCase(); };
  const last=[],first=[]; let i=0;
  while(i<toks.length && isUp(toks[i])){ last.push(toks[i]); i++; }
  while(i<toks.length){ first.push(toks[i]); i++; }
  // Cas "NOM PRENOM" (tout en majuscules) : dernier token = prénom
  if(!first.length && last.length>1){ first.push(last.pop()); }
  if(!last.length && toks.length){ return {last:toks[0], first:toks.slice(1).join(' ')}; }
  return {last:last.join(' '), first:first.join(' ')};
}
function startL29Import(){ if(needAdmin())return; document.getElementById('l29File').click(); }
async function onL29File(ev){
  const file=ev.target.files[0]; if(!file){return;} ev.target.value='';
  if(needAdmin())return;
  if(!window.pdfjsLib){ toast('⚠ Lecteur PDF non chargé, vérifiez la connexion','err'); return; }
  try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js'; }catch(e){}
  openImportLoading(file.name);
  try{
    const parsed=await parseL29Pdf(file);
    if(!parsed.length){ document.getElementById('impModal').innerHTML=`<h3>Import L29</h3><p class="mhint">Aucune donnée exploitable n'a été trouvée dans ce PDF. Vérifiez qu'il s'agit bien d'un export « L29 - SUIVI DES EFFECTIFS ».</p><div class="modal-actions"><button class="btn ghost" onclick="closeImport()">Fermer</button></div>`; return; }
    IMP={sites:parsed}; renderImport();
  }catch(e){ document.getElementById('impModal').innerHTML=`<h3>Import impossible</h3><p class="mhint">${esc(e.message||String(e))}</p><div class="modal-actions"><button class="btn ghost" onclick="closeImport()">Fermer</button></div>`; }
}
function openImportLoading(fname){ const m=document.getElementById('impModal'); m.innerHTML=`<h3>📥 Import L29</h3><p class="mhint">Lecture de <b>${esc(fname)}</b>…</p><div class="loader" style="min-height:120px"><div class="spin"></div> Analyse du PDF…</div>`; document.getElementById('impOverlay').classList.add('show'); }
function closeImport(){ document.getElementById('impOverlay').classList.remove('show'); document.getElementById('impModal').innerHTML=''; IMP=null; }

async function parseL29Pdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const sitesByCode={}; const order=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vw=page.getViewport({scale:1});
    const tc=await page.getTextContent();
    const items=tc.items.map(it=>({str:(it.str||'').trim(),x:it.transform[4],y:it.transform[5]})).filter(it=>it.str!=='');
    if(!items.length) continue;
    // --- Site --- (deux libellés "concerné" existent : Mois ET Site ; on garde celui qui donne un code + nom)
    let code='',name='';
    const anchors=items.filter(i=>/concern/i.test(stripAccents(i.str)));
    for(const anc of anchors){
      const right=items.filter(i=>Math.abs(i.y-anc.y)<5 && i.x>anc.x).sort((a,b)=>a.x-b.x);
      const rt=(anc.str+' '+right.map(i=>i.str).join(' ')).replace(/(?:mois|site)?\s*concern[ée]s?\s*:?/i,' ');
      const mm=rt.match(/(\d{3,6})\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9'’ .\-]*)/);
      if(mm){ code=mm[1].trim(); name=mm[2].replace(/\s+/g,' ').trim(); break; }
    }
    if(!name) name='Site '+(p);
    if(!code) code='p'+p;
    // --- Colonnes (anchors ENTRÉS / INCHANGÉS / SORTIS) ---
    const fx=re=>{ const it=items.find(i=>re.test(stripAccents(i.str).toUpperCase())); return it?it.x:null; };
    let xE=fx(/COLLABORATEURS\s+ENTR/)||fx(/\bENTRES?\b/);
    let xI=fx(/COLLABORATEURS\s+INCHANG/)||fx(/INCHANG/);
    let xS=fx(/COLLABORATEURS\s+SORTI/)||fx(/SORTIS?/);
    if(xE==null||xI==null||xS==null){ xE=vw.width*0.02; xI=vw.width*0.37; xS=vw.width*0.70; }
    const b1=(xE+xI)/2, b2=(xI+xS)/2;
    const colOf=x=> x<b1?0:(x<b2?1:2);
    // --- Regrouper par ligne (y) dans chaque colonne ---
    const cols=[[],[],[]];
    items.forEach(i=>cols[colOf(i.x)].push(i));
    function rowsOf(arr){
      arr.sort((a,b)=>b.y-a.y);
      const buckets=[];
      arr.forEach(i=>{ let bk=buckets.find(bb=>Math.abs(bb.y-i.y)<3.2); if(!bk){bk={y:i.y,its:[]};buckets.push(bk);} bk.its.push(i); });
      return buckets.map(bk=>bk.its.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim());
    }
    function parseRows(lines){
      const out=[];
      lines.forEach(line=>{
        if(/collaborateur|d[ée]but contrat|fin contrat|^COLLABORATEURS/i.test(line)) return;
        const ds=[...line.matchAll(/(\d{2})-(\d{2})-(\d{4})/g)];
        if(!ds.length) return;
        const nameRaw=line.slice(0,ds[0].index).replace(/[▲▼▲▼]/g,'').trim();
        if(!nameRaw) return;
        out.push({raw:nameRaw, trunc:isTrunc(nameRaw), debut:dmyToIso(ds[0][0]), fin:ds[1]?dmyToIso(ds[1][0]):''});
      });
      return out;
    }
    const entres=parseRows(rowsOf(cols[0]));
    const inchanges=parseRows(rowsOf(cols[1]));
    const sortis=parseRows(rowsOf(cols[2]));
    let s=sitesByCode[code];
    if(!s){ s={code,name,entres:[],inchangesCount:0,sortis:[]}; sitesByCode[code]=s; order.push(code); }
    s.entres.push(...entres); s.sortis.push(...sortis); s.inchangesCount+=inchanges.length;
  }
  return order.map(c=>sitesByCode[c]);
}

/* ---- Correspondances ---- */
function guessRestoId(siteName){
  const target=L29_SITE_MAP[stripAccents(siteName).toUpperCase().trim()];
  if(target){ const r=STORE.restaurants.find(x=>x.name===target); if(r)return r.id; }
  const k=normKey(siteName);
  let r=STORE.restaurants.find(x=>normKey(x.name)===k); if(r)return r.id;
  r=STORE.restaurants.find(x=>normKey(x.name).includes(k)||k.includes(normKey(x.name))); if(r)return r.id;
  return '';
}
function matchCollab(resto,raw){
  if(!resto) return {none:true};
  const t=normKey(stripTrunc(raw)); const trunc=isTrunc(raw);
  const act=resto.collaborators.filter(c=>!c.archived);
  const keys=act.map(c=>({c,a:normKey(c.lastName+c.firstName),b:normKey(c.firstName+c.lastName)}));
  let hit=keys.filter(x=>x.a===t||x.b===t);
  if(hit.length===1) return {c:hit[0].c};
  if(hit.length>1) return {ambiguous:true};
  if(trunc && t.length>=3){ hit=keys.filter(x=>x.a.startsWith(t)||x.b.startsWith(t)); if(hit.length===1)return{c:hit[0].c}; if(hit.length>1)return{ambiguous:true}; }
  return {none:true};
}
function restoOptions(sel){
  const opts=STORE.restaurants.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(r=>`<option value="${r.id}" ${String(r.id)===String(sel)?'selected':''}>${esc(r.name)}</option>`).join('');
  return `<option value="">— Ignorer ce site —</option>${opts}`;
}

/* ---- Rendu de l'aperçu ---- */
function renderImport(){
  IMP.sites.forEach(s=>{ if(s.rid===undefined) s.rid=guessRestoId(s.name); });
  const totals=computeImportTotals();
  const sitesH=IMP.sites.map((s,idx)=>`
    <div class="imp-site" data-site="${idx}">
      <div class="imp-site-head">
        <div class="sname">🏠 ${esc(s.name)} <span class="scode">(${esc(s.code)})</span></div>
        <div class="spush"><span>→ Restaurant :</span><select class="rmap" data-site="${idx}" onchange="remapSite(${idx},this.value)">${restoOptions(s.rid)}</select></div>
      </div>
      <div class="imp-site-body" id="impBody${idx}">${renderSiteBody(idx)}</div>
    </div>`).join('');
  document.getElementById('impModal').innerHTML=`
    <div class="imp-head" style="display:flex;align-items:center;gap:10px;justify-content:space-between">
      <h3 style="margin:0">📥 Import L29 — aperçu</h3>
      <button class="icon-btn" style="color:var(--ink-soft);background:#f2f4ef" onclick="closeImport()">✕ Fermer</button>
    </div>
    <p class="mhint">Vérifiez la correspondance des sites et les collaborateurs à créer / archiver, puis validez. <b>Rien n'est écrit dans la base tant que vous n'avez pas cliqué sur « Valider ».</b></p>
    <div class="imp-sum" id="impSum">${totals.html}</div>
    <div class="imp-scroll">${sitesH}</div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn ghost" onclick="closeImport()">Annuler</button>
      <button class="btn" id="impApplyBtn" onclick="applyImport()">✓ Valider et appliquer</button>
    </div>`;
  document.getElementById('impOverlay').classList.add('show');
}
function computeImportTotals(){
  let create=0,archive=0,ignored=0,unmapped=0;
  IMP.sites.forEach((s,idx)=>{ const cl=classifySite(idx); create+=cl.create.length; archive+=cl.archive.length; ignored+=cl.ignored.length+cl.badSort.length; if(!s.rid)unmapped++; });
  const html=`<span class="imp-chip green">À créer : <b>${create}</b></span><span class="imp-chip gold">À archiver : <b>${archive}</b></span><span class="imp-chip">Ignorés : <b>${ignored}</b></span><span class="imp-chip">Sites : <b>${IMP.sites.length}</b></span>${unmapped?`<span class="imp-chip gold">Sites non mappés : <b>${unmapped}</b></span>`:''}`;
  return {create,archive,ignored,html};
}
function classifySite(idx){
  const s=IMP.sites[idx]; const resto=s.rid?getResto(s.rid):null;
  const create=[],ignored=[],archive=[],badSort=[];
  s.entres.forEach(e=>{
    if(e.fin){ ignored.push({e,reason:'Fin de contrat renseignée ('+frDate(e.fin)+')'}); return; }
    const m=resto?matchCollab(resto,e.raw):{none:true};
    if(m.c){ ignored.push({e,reason:'Déjà présent : '+m.c.firstName+' '+m.c.lastName}); return; }
    const sp=splitL29Name(e.raw);
    create.push({e,last:sp.last,first:sp.first});
  });
  s.sortis.forEach(o=>{
    const m=resto?matchCollab(resto,o.raw):{none:true};
    if(m.c) archive.push({o,c:m.c});
    else badSort.push({o,reason:m.ambiguous?'Plusieurs correspondances — à traiter manuellement':'Introuvable parmi les actifs (déjà archivé ?)'});
  });
  return {create,ignored,archive,badSort};
}
function renderSiteBody(idx){
  const s=IMP.sites[idx]; const cl=classifySite(idx);
  if(!s.rid){ return `<div class="imp-none">Site non associé à un restaurant — sélectionnez un restaurant ci-dessus ou laissez « Ignorer » pour ne rien importer pour ce site. (${s.entres.length} entré(s), ${s.sortis.length} sorti(s) dans le fichier.)</div>`; }
  const createH = cl.create.length ? cl.create.map(x=>`
    <div class="imp-row entre ${x.e.trunc?'warn':''}">
      <input type="checkbox" class="chk" checked>
      <input type="text" class="nm" value="${esc(x.last)}" placeholder="NOM" title="Nom">
      <input type="text" class="fn" value="${esc(x.first)}" placeholder="Prénom" title="Prénom">
      <input type="date" class="dt" value="${esc(x.e.debut||'')}" title="Date d'entrée">
      ${x.e.trunc?'<span class="imp-note">⚠ nom tronqué dans le PDF — à compléter</span>':''}
    </div>`).join('') : '<div class="imp-none">Aucune création.</div>';
  const archiveH = cl.archive.length ? cl.archive.map(x=>`
    <div class="imp-row sorti" data-cid="${x.c.id}" data-nm="${esc(x.c.firstName+' '+x.c.lastName)}">
      <input type="checkbox" class="chk" checked>
      <span class="imp-nm">${esc(x.c.firstName+' '+x.c.lastName)}</span>
      <span class="imp-arrow">← ${esc(x.o.raw)}</span>
    </div>`).join('') : '<div class="imp-none">Aucun archivage.</div>';
  const badH = cl.badSort.length ? `<div class="imp-grp"><h5>Sorties non appariées</h5>${cl.badSort.map(x=>`<div class="imp-row ign"><span class="imp-nm imp-strike">${esc(x.o.raw)}</span><span class="imp-note ${/Introuvable/.test(x.reason)?'err':''}">${esc(x.reason)}</span></div>`).join('')}</div>` : '';
  const ignH = cl.ignored.length ? `<div class="imp-grp"><h5>Entrées ignorées</h5>${cl.ignored.map(x=>`<div class="imp-row ign"><span class="imp-nm imp-strike">${esc(x.e.raw)}</span><span class="imp-note mut">${esc(x.reason)}</span></div>`).join('')}</div>` : '';
  return `
    <div class="imp-grp"><h5>À créer (entrées) · ${cl.create.length}</h5>${createH}</div>
    <div class="imp-grp"><h5>À archiver (sorties) · ${cl.archive.length}</h5>${archiveH}</div>
    ${badH}${ignH}`;
}
function remapSite(idx,rid){ IMP.sites[idx].rid=rid; const b=document.getElementById('impBody'+idx); if(b)b.innerHTML=renderSiteBody(idx); const sum=document.getElementById('impSum'); if(sum)sum.innerHTML=computeImportTotals().html; }

async function applyImport(){
  if(needAdmin())return;
  const toCreate={}, toArchive=[]; let nCreate=0,nArch=0;
  document.querySelectorAll('#impModal .imp-site').forEach(se=>{
    const rid=se.querySelector('select.rmap').value; if(!rid)return;
    se.querySelectorAll('.imp-row.entre').forEach(row=>{
      const cb=row.querySelector('input.chk'); if(!cb||!cb.checked)return;
      const last=row.querySelector('input.nm').value.trim();
      const first=row.querySelector('input.fn').value.trim();
      const dt=row.querySelector('input.dt').value;
      if(!last&&!first)return;
      (toCreate[rid]=toCreate[rid]||[]).push({restaurant_id:rid,first_name:first,last_name:last,role:'',entry_date:dt||todayISO(),passport:operationalTemplate()});
      nCreate++;
    });
    se.querySelectorAll('.imp-row.sorti').forEach(row=>{
      const cb=row.querySelector('input.chk'); if(!cb||!cb.checked)return;
      const cid=row.getAttribute('data-cid'); if(cid){ toArchive.push({cid,name:row.getAttribute('data-nm')||''}); nArch++; }
    });
  });
  if(!nCreate&&!nArch){ toast('Rien à appliquer — tout est décoché ou ignoré','err'); return; }
  const btn=document.getElementById('impApplyBtn'); if(btn){ btn.disabled=true; btn.textContent='Application…'; }
  try{
    for(const rid in toCreate){
      const {data,error}=await sb.from('pp_collaborators').insert(toCreate[rid]).select();
      if(error)throw error;
      for(const c of (data||[])) await audit('collaborateur',c.id,'Création (import L29)',(c.first_name+' '+c.last_name).trim());
    }
    for(const a of toArchive){
      const {error}=await sb.from('pp_collaborators').update({archived:true}).eq('id',a.cid);
      if(!error) await audit('collaborateur',a.cid,'Archivage (import L29)',a.name);
    }
    closeImport();
    toast(`✅ Import L29 : ${nCreate} créé(s) · ${nArch} archivé(s)`,'gold');
    reloadAndRender();
  }catch(e){ toast('⚠ '+(e.message||String(e)),'err'); if(btn){ btn.disabled=false; btn.textContent='✓ Valider et appliquer'; } }
}

const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
function closeModal(){ overlay.classList.remove('show'); modal.innerHTML=''; signCtx=null; }
function modalResto(){ if(needAdmin())return; modal.innerHTML=`<h3>Nouveau restaurant</h3><p class="mhint">Créez un point de vente pour y rattacher vos collaborateurs.</p><div class="field"><label>Nom</label><input id="rname" placeholder="Ex. Salad&Co Lille Centre"></div><div class="field"><label>Ville (optionnel)</label><input id="rcity" placeholder="Ex. Lille"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="createResto()">Créer</button></div>`; overlay.classList.add('show'); setTimeout(()=>document.getElementById('rname').focus(),50); }
function modalCollab(rid){ if(needAdmin())return; modal.innerHTML=`<h3>Nouveau collaborateur</h3><p class="mhint">Un passeport vierge sera créé automatiquement.</p><div class="row2"><div class="field"><label>Prénom</label><input id="cf" placeholder="Prénom"></div><div class="field"><label>Nom</label><input id="cl" placeholder="Nom"></div></div><div class="field"><label>Poste / fonction</label><input id="cr" placeholder="Ex. Équipier polyvalent"></div><div class="field"><label>Date d’entrée</label><input id="cd" type="date" value="${todayISO()}"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="createCollab('${rid}')">Créer le passeport</button></div>`; overlay.classList.add('show'); setTimeout(()=>document.getElementById('cf').focus(),50); }
function confirmModal(title,html,onOk){ modal.innerHTML=`<h3>${title}</h3><p class="mhint">${html}</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" id="cfok">Supprimer</button></div>`; overlay.classList.add('show'); document.getElementById('cfok').onclick=()=>{closeModal();onOk();}; }
function confirmModalGeneric(title,html,okLabel,onOk){ modal.innerHTML=`<h3>${title}</h3><p class="mhint">${html}</p><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="cfok2">${esc(okLabel)}</button></div>`; overlay.classList.add('show'); document.getElementById('cfok2').onclick=()=>{onOk();}; }
function modalAccount(){ modal.innerHTML=`<h3>Mon compte</h3><p class="mhint">${esc(ME.email)} · ${isAdmin()?'Administrateur':'Directeur invité'}</p><div class="field"><label>Nouveau mot de passe</label><input id="npw" type="password" placeholder="Laisser vide pour ne pas changer"></div><div class="modal-actions"><button class="btn ghost" onclick="logout()">Se déconnecter</button><button class="btn" onclick="changePw()">Enregistrer</button></div>`; overlay.classList.add('show'); }
async function changePw(){ const v=document.getElementById('npw').value; if(!v){closeModal();return;} if(v.length<6)return toast('Mot de passe trop court (min 6)','err'); const {error}=await sb.auth.updateUser({password:v}); if(error)return toast('⚠ '+error.message,'err'); closeModal(); toast('🔑 Mot de passe mis à jour'); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function modalShare(){
  if(needAdmin())return;
  modal.innerHTML=`<h3>Accès & directeurs</h3><p class="mhint">Partagez le lien et invitez d’autres directeurs. Les directeurs invités ont des droits réduits : gestion des évaluations EAD (consultation du reste).</p>
    <div class="field"><label>Lien de la plateforme</label><div class="mono" id="shareUrl">${esc(location.href.split('#')[0])}</div><button class="btn ghost small" style="margin-top:8px" onclick="copyShare()">📋 Copier le lien</button></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0"><h3 style="font-size:16px">Inviter un directeur</h3>
    <div class="row2"><div class="field"><label>Nom</label><input id="ivn" placeholder="Nom"></div><div class="field"><label>Rôle</label><select id="ivr"><option value="invite">Directeur invité (droits réduits)</option><option value="admin">Administrateur (tous droits)</option></select></div></div>
    <div class="field"><label>Email</label><input id="ive" type="email" placeholder="directeur@saladandco.fr"></div>
    <div class="field"><label>Mot de passe provisoire</label><input id="ivp" value="SaladCo-${Math.floor(1000+Math.random()*9000)}"><div style="font-size:11.5px;color:var(--muted);margin-top:6px">Si la personne a déjà un compte Salad&Co, elle se connecte avec son mot de passe habituel — le mot de passe provisoire est ignoré.</div></div>
    <div class="field" id="ivRestoField"><label>Restaurants autorisés</label><div id="ivRestos" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">${restoCheckboxes([])}</div><div style="font-size:11.5px;color:var(--muted);margin-top:6px">Cochez les restaurants visibles par ce directeur. <b>Aucune case cochée = accès à tous les restaurants.</b> Sans effet pour un administrateur (il voit tout).</div></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="inviteDirector()">Créer l’accès</button></div>
    <div id="usersList" style="margin-top:18px"></div>`;
  overlay.classList.add('show'); loadUsers();
}
function copyShare(){ navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>toast('📋 Lien copié')); }
async function callFn(action,payload){ const {data:{session}}=await sb.auth.getSession(); const res=await fetch(SUPA_URL+'/functions/v1/pp-users',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+(session?session.access_token:SUPA_KEY)},body:JSON.stringify({action,...payload})}); return res.json(); }
function restoCheckboxes(sel){ const S=new Set((sel||[]).map(String)); return (STORE.restaurants||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(r=>`<label style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:#fff"><input type="checkbox" class="resto-cb" value="${r.id}" ${S.has(String(r.id))?'checked':''}> ${esc(r.name)}</label>`).join('')||'<span style="font-size:12px;color:var(--muted)">Aucun restaurant.</span>'; }
async function findProfileIdByEmail(email){ const r=await callFn('list',{}); const u=(r.users||[]).find(x=>(x.email||'').toLowerCase()===email.toLowerCase()); return u?u.id:null; }
async function inviteDirector(){ const email=document.getElementById('ive').value.trim(),full_name=document.getElementById('ivn').value.trim(),role=document.getElementById('ivr').value,password=document.getElementById('ivp').value.trim(); if(!email)return toast('Email requis','err'); const restoIds=[...document.querySelectorAll('#ivRestos .resto-cb:checked')].map(c=>c.value); const r=await callFn('invite',{email,password,full_name,role}); if(r.error)return toast('⚠ '+r.error,'err'); if(role!=='admin'){ const uid=await findProfileIdByEmail(email); if(uid){ await sb.from('pp_profile_restaurants').delete().eq('profile_id',uid); if(restoIds.length){ const {error}=await sb.from('pp_profile_restaurants').insert(restoIds.map(rid=>({profile_id:uid,restaurant_id:rid}))); if(error)toast('⚠ Accès créé mais restaurants non enregistrés : '+error.message,'err'); } } } toast(r.existing?'✅ Accès accordé — la personne se connecte avec son mot de passe Salad&Co habituel':'✅ Accès créé — communiquez-lui l’email + le mot de passe provisoire','gold'); document.getElementById('ive').value=''; loadUsers(); }
async function manageResto(id,name){ const {data}=await sb.from('pp_profile_restaurants').select('restaurant_id').eq('profile_id',id); const sel=(data||[]).map(x=>x.restaurant_id); modal.innerHTML=`<h3>🏠 Restaurants — ${esc(name)}</h3><p class="mhint">Cochez les restaurants visibles par ce directeur. <b>Aucune case cochée = accès à tous les restaurants.</b></p><div id="mgRestos" style="display:flex;flex-wrap:wrap;gap:8px">${restoCheckboxes(sel)}</div><div class="modal-actions"><button class="btn ghost" onclick="modalShare()">Annuler</button><button class="btn" onclick="saveResto('${id}','${esc(name)}')">Enregistrer</button></div>`; overlay.classList.add('show'); }
async function saveResto(id,name){ const ids=[...document.querySelectorAll('#mgRestos .resto-cb:checked')].map(c=>c.value); const {error:delErr}=await sb.from('pp_profile_restaurants').delete().eq('profile_id',id); if(delErr)return toast('⚠ '+delErr.message,'err'); if(ids.length){ const {error}=await sb.from('pp_profile_restaurants').insert(ids.map(rid=>({profile_id:id,restaurant_id:rid}))); if(error)return toast('⚠ '+error.message,'err'); } toast('✅ Restaurants mis à jour','gold'); modalShare(); }
async function loadUsers(){ const el=document.getElementById('usersList'); if(!el)return; const [r,assignRes]=await Promise.all([callFn('list',{}),sb.from('pp_profile_restaurants').select('profile_id,restaurant_id')]); if(!el)return; if(r.error){el.innerHTML='<p class="phint">'+esc(r.error)+'</p>';return;} const assigns=assignRes.data||[]; const nameOf=id=>{ const rr=(STORE.restaurants||[]).find(x=>String(x.id)===String(id)); return rr?rr.name:'?'; }; el.innerHTML=`<h3 style="font-size:15px;margin-bottom:8px">Directeurs ayant accès</h3>`+(r.users||[]).map(u=>{ const mine=assigns.filter(a=>a.profile_id===u.id).map(a=>a.restaurant_id); const restoLine=u.role==='admin'?'<span style="color:var(--muted)">Tous les restaurants</span>':(mine.length?mine.map(id=>esc(nameOf(id))).join(', '):'<span style="color:#c08a00">Tous (non restreint)</span>'); const manageBtn=u.role!=='admin'?`<button class="tiny-btn" title="Restaurants autorisés" onclick="manageResto('${u.id}','${esc(u.full_name||u.email)}')">🏠</button>`:''; return `<div class="sess-row"><div class="sess-main"><div class="sess-top"><b>${esc(u.full_name||u.email)}</b> <span class="role-pill ${u.role==='admin'?'admin':'invite'}">${u.role==='admin'?'Admin':'Invité'}</span></div><div class="sess-meta">${esc(u.email)}</div><div class="sess-meta" style="margin-top:3px">🏠 ${restoLine}</div></div><div class="sess-acts">${manageBtn}<button class="tiny-btn" title="Réinitialiser le mot de passe" onclick="resetUserPw('${u.id}','${esc(u.full_name||u.email)}')">🔑</button>${u.id!==ME.id?`<button class="tiny-btn danger" onclick="delUser('${u.id}','${esc(u.full_name||u.email)}')">🗑</button>`:'<span style="font-size:11px;color:var(--muted)">vous</span>'}</div></div>`; }).join(''); }
async function delUser(id,name){ if(!confirm('Retirer l’accès de '+name+' ?'))return; const r=await callFn('delete',{user_id:id}); if(r.error)return toast('⚠ '+r.error,'err'); toast('Accès retiré'); loadUsers(); }
function resetUserPw(id,name){ const pw='SaladCo-'+Math.floor(1000+Math.random()*9000); modal.innerHTML=`<h3>Réinitialiser le mot de passe</h3><p class="mhint">Nouveau mot de passe provisoire pour <b>${esc(name)}</b>.</p><div style="background:#fbf6e8;border:1px solid #f0e2b8;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:12px">⚠️ Si cette personne utilise le même compte pour d’autres outils Salad&Co, ce mot de passe changera aussi pour ces outils.</div><div class="field"><label>Nouveau mot de passe</label><input id="rupw" value="${pw}"></div><div class="modal-actions"><button class="btn ghost" onclick="modalShare()">Annuler</button><button class="btn" onclick="doResetUserPw('${id}','${esc(name)}')">Réinitialiser</button></div>`; overlay.classList.add('show'); }
async function doResetUserPw(id,name){ const pw=document.getElementById('rupw').value.trim(); if(pw.length<6)return toast('Min 6 caractères','err'); const r=await callFn('reset_password',{user_id:id,password:pw}); if(r.error)return toast('⚠ '+r.error,'err'); modal.innerHTML=`<h3>✅ Mot de passe réinitialisé</h3><p class="mhint">Communiquez ce mot de passe à <b>${esc(name)}</b> :</p><div class="mono">${esc(pw)}</div><p class="phint" style="margin-top:10px">La personne pourra le modifier via l’icône ⚙ après connexion.</p><div class="modal-actions"><button class="btn" onclick="modalShare()">Retour</button></div>`; }

/* ===================== TOAST ===================== */
function toast(msg,cls=''){ const z=document.getElementById('toasts'),t=document.createElement('div'); t.className='toast '+cls; t.innerHTML=msg; z.appendChild(t); setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),300);},2800); }

/* ===================== AUTH ===================== */
const authView=document.getElementById('authView'),mainApp=document.getElementById('mainApp'),boot=document.getElementById('boot');
function showAuthErr(m){ const e=document.getElementById('authErr'); e.textContent=m; e.classList.add('show'); }
function clearAuthErr(){ document.getElementById('authErr').classList.remove('show'); }
async function renderAuth(){
  boot.style.display='none'; mainApp.style.display='none'; authView.style.display='flex';
  const {data}=await sb.rpc('pp_admin_exists');
  const adminExists=data===true;
  const f=document.getElementById('authFields');
  if(!adminExists){
    document.getElementById('authTitle').textContent='Bienvenue';
    document.getElementById('authSub').textContent='Créez le compte administrateur de la plateforme';
    f.innerHTML=`<div class="field"><label>Votre nom</label><input id="bn" placeholder="Prénom Nom"></div><div class="field"><label>Email</label><input id="be" type="email" value="bastien.goudemand@saladandco.fr"></div><div class="field"><label>Mot de passe</label><input id="bp" type="password" placeholder="Min. 6 caractères"></div><button class="btn" style="width:100%;justify-content:center" onclick="doBootstrap()">Créer mon compte administrateur</button>`;
  } else {
    document.getElementById('authTitle').textContent='Connexion';
    document.getElementById('authSub').textContent='Salad&Co — Passeport Collaborateur';
    f.innerHTML=`<div class="field"><label>Email</label><input id="le" type="email" placeholder="vous@saladandco.fr"></div><div class="field"><label>Mot de passe</label><input id="lp" type="password" placeholder="Mot de passe"></div><button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">Se connecter</button><div style="text-align:center;margin-top:14px"><a onclick="forgotPw()" style="font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline">Mot de passe oublié ?</a></div>`;
    setTimeout(()=>{const el=document.getElementById('le');if(el)el.focus();},50);
  }
}
async function doBootstrap(){ clearAuthErr(); const full_name=document.getElementById('bn').value.trim(),email=document.getElementById('be').value.trim(),password=document.getElementById('bp').value; if(!email||password.length<6)return showAuthErr('Email valide et mot de passe (min 6) requis.'); const r=await callFn('bootstrap',{email,password,full_name}); if(r.error)return showAuthErr(r.error); const {error}=await sb.auth.signInWithPassword({email,password}); if(error)return showAuthErr(error.message); await afterLogin(); }
async function doLogin(){ clearAuthErr(); const email=document.getElementById('le').value.trim(),password=document.getElementById('lp').value; const {error}=await sb.auth.signInWithPassword({email,password}); if(error)return showAuthErr('Identifiants incorrects.'); await afterLogin(); }
async function forgotPw(){ clearAuthErr(); const el=document.getElementById('le'); const email=(el&&el.value.trim())||''; if(!email)return showAuthErr('Saisissez d’abord votre email ci-dessus, puis cliquez sur « Mot de passe oublié ? ».'); const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin}); if(error)return showAuthErr(error.message); toast('📧 Si un compte existe pour cet email, un lien de réinitialisation vient d’être envoyé (pensez aux indésirables).','gold'); }
let recovering=false;
function showSetNewPw(){ recovering=true; document.getElementById('boot').style.display='none'; authView.style.display='none'; mainApp.style.display='none'; modal.innerHTML=`<h3>Nouveau mot de passe</h3><p class="mhint">Choisissez votre nouveau mot de passe pour accéder à la plateforme.</p><div class="field"><label>Nouveau mot de passe</label><input id="rpw" type="password" placeholder="Min. 6 caractères"></div><div class="modal-actions"><button class="btn" style="flex:1;justify-content:center" onclick="applyNewPw()">Enregistrer et continuer</button></div>`; overlay.classList.add('show'); setTimeout(()=>{const el=document.getElementById('rpw');if(el)el.focus();},60); }
async function applyNewPw(){ const v=document.getElementById('rpw').value; if(!v||v.length<6)return toast('Mot de passe trop court (min 6)','err'); const {error}=await sb.auth.updateUser({password:v}); if(error)return toast('⚠ '+error.message,'err'); closeModal(); recovering=false; toast('🔑 Mot de passe mis à jour'); await afterLogin(); }
async function afterLogin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ return renderAuth(); }
  let {data:prof}=await sb.from('pp_profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){ showAuthErr('Profil introuvable. Contactez l’administrateur.'); await sb.auth.signOut(); return; }
  ME=prof;
  authView.style.display='none'; boot.style.display='flex';
  await loadRef(); await loadAll();
  if(isAdmin() && STORE.restaurants.length===0 && !window.__seeding){ window.__seeding=true; boot.innerHTML='<div class="spin"></div> Initialisation des données…'; try{ await seedDB(); }catch(e){} await loadAll(); }
  boot.style.display='none'; mainApp.style.display='block';
  subscribeRealtime(); render();
}
let realtimeSubscribed=false;
function subscribeRealtime(){
  if(realtimeSubscribed)return; realtimeSubscribed=true;
  ['pp_restaurants','pp_collaborators','pp_ead_progress','pp_ead_sessions','pp_entretiens','pp_audit_log','pp_config'].forEach(tb=>{
    try{ sb.channel('rt_'+tb).on('postgres_changes',{event:'*',schema:'public',table:tb},scheduleReload).subscribe(); }catch(e){}
  });
}

/* ===================== SEED DÉMO ===================== */
async function seedDB(){
  const names=['Salad&Co Lille Centre',...DEFAULT_RESTOS];
  const {data:rows}=await sb.from('pp_restaurants').insert(names.map(n=>({name:n,city:'',created_by:ME.id}))).select();
  const idOf=n=>rows.find(r=>r.name===n).id;
  async function mk(resto,f,l,role,entry,eadStage,posteIds,session){
    const pp=operationalTemplate();
    (posteIds||[]).forEach(pid=>{ const po=REF.postes.find(x=>x.id===pid); if(po){ pp.postes[pid]={comps:{},eval:''}; po.comps.forEach(c=>pp.postes[pid].comps[c.id]={done:true,date:entry}); } });
    REF.elearning.forEach(e=>pp.elearning[e.id]=true);
    const {data:cc}=await sb.from('pp_collaborators').insert({restaurant_id:idOf(resto),first_name:f,last_name:l,role,entry_date:entry,passport:pp}).select().single();
    if(eadStage){ const rws=REF.eadComps.filter(c=>c.stage<=eadStage).map(c=>({collaborator_id:cc.id,comp_id:c.id,done:true,done_at:entry})); if(rws.length)await sb.from('pp_ead_progress').insert(rws); }
    if(session)await sb.from('pp_ead_sessions').insert({collaborator_id:cc.id,...session});
    return cc.id;
  }
  const closeF=(()=>{const d=new Date();d.setDate(d.getDate()+14);return d.toISOString().slice(0,10);})();
  await mk('Salad&Co Lille Centre','Léa','Martin','Équipière polyvalente','2025-09-15',2,['atelier_fraicheur','dessert','bar'],{label:'Évaluation EAD 2025',open_date:'2025-11-02',close_date:'2025-11-16',status:'cloturee',evaluator:'Alice Delobel',notes:'Belle progression, passage au stade « La pousse ».',start_stage:1,end_stage:2,closed_at:'2025-11-16'});
  await mk('Salad&Co Lille Centre','Karim','Benali','Équipier','2026-06-01',1,['plancha'],{label:'Évaluation EAD 2026',open_date:todayISO(),close_date:closeF,status:'ouverte',evaluator:'Alice Delobel',start_stage:1});
  await mk('Héron','Chloé','Faure','Équipière polyvalente','2024-05-02',3,['atelier_fraicheur','salle','bar','dessert'],null);
  await mk('Héron','Marc','Lemoine','Adjoint','2021-09-15',4,['atelier_fraicheur','plancha','caisse','salle','bar'],null);
  await mk('Mérignac','Théo','Garcia','Équipier polyvalent','2023-03-08',3,['plancha','caisse','reception'],null);
}

/* ===================== INIT ===================== */
sb.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY'){ showSetNewPw(); } });
(async function init(){
  if((location.hash||'').includes('type=recovery')){ return; } // l'événement PASSWORD_RECOVERY affichera le formulaire
  const {data:{session}}=await sb.auth.getSession();
  if(recovering) return;
  if(session){ await afterLogin(); } else { renderAuth(); }
})();

/* ===================== MOBILE & PWA ===================== */
/* Sur écran tactile, taper le libellé d'une compétence coche/décoche la case. */
document.addEventListener('click',e=>{
  try{
    if(!window.matchMedia||!matchMedia('(pointer:coarse)').matches)return;
    const lbl=e.target.closest('.clabel'); if(!lbl)return;
    if(e.target.closest('a,button,textarea,input,.cbox'))return;
    const box=lbl.parentElement&&lbl.parentElement.querySelector('.cbox');
    if(box)box.click();
  }catch(err){}
});
/* Installation sur l'écran d'accueil (PWA) — nécessite manifest.webmanifest, sw.js et les icônes à côté de ce fichier. */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
/* --- Bouton « Installer l'application » --- */
let pwaPrompt=null;
function pwaStandalone(){ try{ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }catch(e){ return false; } }
function pwaIsIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); }
function installBtnHtml(){
  if(pwaStandalone()) return '';                 // déjà installée : pas de bouton
  if(!pwaPrompt&&!pwaIsIOS()) return '';         // pas encore installable sur ce navigateur
  return `<button class="btn ghost" onclick="installApp()" title="Ajouter le Passeport à l'écran d'accueil">📲 Installer l'application</button>`;
}
async function installApp(){
  if(pwaPrompt){
    const p=pwaPrompt; pwaPrompt=null;
    try{ p.prompt(); const ch=await p.userChoice; if(ch&&ch.outcome==='accepted'){ toast('📲 Application installée !','gold'); } else { pwaPrompt=p; } }catch(e){ pwaPrompt=p; }
    render();
    return;
  }
  // iOS (Safari) : pas d'installation automatique possible, on guide pas à pas
  modal.innerHTML=`<h3>📲 Installer sur iPhone / iPad</h3><p class="mhint">Safari ne propose pas de bouton automatique — c'est l'affaire de 3 gestes :</p>
    <div class="ref-steps" style="display:flex;flex-direction:column;gap:12px">
      <div>1️⃣ Touchez le bouton <b>Partager</b> <span style="display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px">⬆️</span> en bas de Safari</div>
      <div>2️⃣ Faites défiler et choisissez <b>« Sur l'écran d'accueil »</b></div>
      <div>3️⃣ Touchez <b>Ajouter</b> — l'icône <span style="display:inline-block;background:#1b1d1a;color:#6cbe2e;font-weight:900;border-radius:6px;padding:0 7px;transform:skewX(-6deg)">&amp;</span> Passeport apparaît comme une app</div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Compris</button></div>`;
  overlay.classList.add('show');
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); pwaPrompt=e; try{ if(document.getElementById('mainApp').style.display!=='none'&&(!VIEW.name||VIEW.name==='home'))render(); }catch(err){} });
window.addEventListener('appinstalled',()=>{ pwaPrompt=null; toast('📲 Passeport installé sur votre écran d’accueil','gold'); try{ render(); }catch(e){} });
</script>
